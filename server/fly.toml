# Run from the REPOSITORY ROOT, not server/:
# fly deploy --config server/fly.toml --app YOUR_ACTUAL_FLY_APP --ha=false
app = "pairtalk-api"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "127.0.0.1"
  S3_REGION = "auto"
  S3_FORCE_PATH_STYLE = "true"
  RECORDINGS_DIR = "/app/server/recordings"

[deploy]
  release_command = "npm run db:deploy"
  # Polling runs inside this container; avoid overlapping old/new bot instances.
  strategy = "immediate"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
