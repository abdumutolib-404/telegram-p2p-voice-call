name: pairtalk-vm-staging

services:
  app:
    image: ${PAIRTALK_IMAGE:?Set PAIRTALK_IMAGE to an immutable image digest}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The combined image starts Node on 3000 and the Go gateway on 3001.
      PORT: "3001"
      NODE_URL: http://127.0.0.1:3000
      # Keep this URI plain: the Go pgx pool receives the same value and does
      # not accept Prisma-only query parameters such as schema=public.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      RECORDINGS_DIR: /app/server/recordings
      # Node receives the gateway's loopback hop; Go receives Caddy on the
      # fixed Compose subnet. Both must remain explicit and private.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24,127.0.0.0/8,::1/128}
      DISABLE_BOT_POLLING: ${DISABLE_BOT_POLLING:-true}
      DISABLE_BACKGROUND_CRAWLER: ${DISABLE_BACKGROUND_CRAWLER:-true}
    expose:
      - "3001"
    volumes:
      - recordings:/app/server/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?Set the public API hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the ACME notification email}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:?Set current Cloudflare IPv4/IPv6 CIDRs}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

volumes:
  pgdata:
    name: pairtalk-vm-staging-pgdata
  redisdata:
    name: pairtalk-vm-staging-redisdata
  recordings:
    name: pairtalk-vm-staging-recordings
  caddy_data:
    name: pairtalk-vm-staging-caddy-data
  caddy_config:
    name: pairtalk-vm-staging-caddy-config

networks:
  default:
    name: pairtalk-vm-staging-net
    ipam:
      config:
        - subnet: 172.30.0.0/24
