name: Application verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pairtalk_check
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: pairtalk_check
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U pairtalk_check -d pairtalk_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      CI_RUNTIME_FILE: ${{ runner.temp }}/pairtalk-verification.json
      VERIFICATION_DATABASE_URL: postgresql://pairtalk_check:synthetic-ci-password@127.0.0.1:55432/pairtalk_check
      VERIFICATION_REDIS_URL: redis://127.0.0.1:56379
      DATABASE_URL: postgresql://pairtalk_check:synthetic-ci-password@127.0.0.1:55432/pairtalk_check
      DISABLE_BOT_POLLING: 'true'
      DISABLE_BACKGROUND_CRAWLER: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Install locked application dependencies
        run: |
          for package in server client admin landing; do npm ci --prefix "$package"; done
      - name: Prepare isolated persistence and deploy migrations
        run: |
          node scripts/prepare-verification-bindings.cjs "$CI_RUNTIME_FILE"
          node scripts/isolated-command.cjs "$CI_RUNTIME_FILE" migrate
          node scripts/isolated-command.cjs "$CI_RUNTIME_FILE" schema
      - name: Backend typecheck and unit tests
        run: |
          node scripts/verify.cjs build
          node scripts/verify.cjs unit --maxWorkers=2 --minWorkers=1
      - name: Gateway race and persistence tests
        run: |
          node scripts/gateway-check.cjs "$CI_RUNTIME_FILE" test -race ./... -count=1
          node scripts/gateway-check.cjs "$CI_RUNTIME_FILE" vet ./...
      - name: Backend persistence integration
        run: node scripts/isolated-command.cjs "$CI_RUNTIME_FILE" integration
      - name: Mini App tests, lint, and build
        run: |
          npm test --prefix client
          npm run lint --prefix client
          NODE_ENV=production npm run build --prefix client
      - name: Administrator lint and build
        run: |
          npm run lint --prefix admin
          NODE_ENV=production npm run build --prefix admin
      - name: Public landing build and SEO checks
        run: |
          NODE_ENV=production npm run build --prefix landing
          npm run check --prefix landing
