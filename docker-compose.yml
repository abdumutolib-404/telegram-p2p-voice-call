services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_MASTER_PASSWORD=${ADMIN_MASTER_PASSWORD:?Set an administrator password}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - JWT_SECRET=${JWT_SECRET:?Set a JWT signing secret}
      # No LiveKit service is bundled here; copy your provider's actual Project URL.
      - LIVEKIT_HOST=${LIVEKIT_HOST:?Set the LiveKit project WebSocket URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Set a LiveKit API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Set a LiveKit API secret}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?Set a database password}@db:5432/ielts_p2p
      - REDIS_URL=redis://redis:6379
      - MINI_APP_URL=${MINI_APP_URL:-http://localhost:3001/client}
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://localhost:3001/admin}
      - RECORDINGS_DIR=/app/server/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: ielts_p2p
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
  redisdata:
