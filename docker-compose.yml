version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_MASTER_PASSWORD=${ADMIN_MASTER_PASSWORD:-admin123456}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_me_in_production}
      - LIVEKIT_HOST=${LIVEKIT_HOST:-ws://livekit:7880}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ielts_p2p
      - REDIS_URL=redis://redis:6379
      - MINI_APP_URL=${MINI_APP_URL:-http://localhost:3001/client}
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://localhost:3001/admin}
      - RECORDINGS_DIR=/app/server/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ielts_p2p
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
