# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Disposable backend staging only. Cloudflare continues to host the frontends.
services:
  - type: web
    name: pairtalk-render-staging
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/abdumutolib-404/telegram-p2p-voice-call
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node prisma/render-staging-start.cjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 127.0.0.1
      - key: NODE_URL
        value: http://127.0.0.1:3000
      - key: RELEASE_COMMAND
        value: "1"
      - key: PAIRTALK_RENDER_STAGING
        value: "true"
      - key: PAIRTALK_RENDER_INITIALIZE_EMPTY_DATABASE
        sync: false
      - key: DISABLE_BOT_POLLING
        value: "true"
      - key: DISABLE_BACKGROUND_CRAWLER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pairtalk-render-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pairtalk-render-staging-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_PASSWORD
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: LIVEKIT_HOST
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_PANEL_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Fail-closed health-smoke default. Add confirmed Render ingress CIDRs
      # only after reviewing proxy evidence; see docs/render-staging.md.
      - key: TRUSTED_PROXY_CIDRS
        value: 127.0.0.1/32,::1/128
      - key: RECORDINGS_DIR
        value: /app/server/recordings

  - type: keyvalue
    name: pairtalk-render-staging-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: pairtalk-render-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: pairtalk_render_staging
    user: pairtalk_render_staging
    ipAllowList: []
