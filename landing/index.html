    <title>PairTalk | IELTS Speaking Practice Partners on Telegram</title>

      name="description"
      content="Find an IELTS speaking partner on Telegram. Practice Parts 1, 2, and 3 with another learner, explore speaking prompts, and start with a free plan."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#101a24" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("pairtalk-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#111b1d" : "#f7f5ef");
      })();
    </script>
